name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set"
            exit 1
          fi
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Could not detect Java major version"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "::error::Active Java version ($JAVA_VER) is lower than 17"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_VER >= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Listing APK files under app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected APK file is empty: $EXPECTED_APK"
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac
          echo "Verified APK at: $EXPECTED_APK"
          ls -la "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          RELEASE_TMP_DIR=$(mktemp -d)
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          SANITIZED_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${RELEASE_TMP_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          echo "Prepared release asset: $ASSET_PATH ($ASSET_FILENAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_filename }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "::error::Release asset is not an APK: $ASSET_PATH"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ### Automated Debug Build
          - **Build Type**: Debug APK
          - **Trigger**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit SHA**: ${{ github.sha }}

          > **Notice**:
          > - This APK is an automated build intended for testing.
          > - This APK is signed with a temporary debug keystore and is not intended for Google Play production release.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_filename }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================================="
            echo " GitHub Release Succeeded!"
            echo "=========================================================="
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            echo "### 🚀 Debug APK Ready for Download" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page**: [Download Debug APK ($ASSET_NAME)]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag**: \`$RELEASE_TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact Backup**: \`app-debug-apk\` is also available in this workflow run's Artifacts section." >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Mobile Download**: Open the release URL on your Android device to download and install the APK directly." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an issue. The debug APK was built and preserved as an Actions artifact."
            echo "### ⚠️ Debug APK Artifact Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- The APK build succeeded and is safely stored as a workflow artifact." >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact Name**: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- You can download \`app-debug-apk\` directly from the Artifacts section at the top of this run summary." >> $GITHUB_STEP_SUMMARY
          fi
